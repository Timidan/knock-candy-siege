# Candy Bank: polls the Worker and grants testnet KNOCK plus gas on Robinhood Chain Testnet.
# No ports: it only makes outgoing connections. The named volume keeps the "already paid" record across redeploys.
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      BANK_URL: ${BANK_URL:?Set BANK_URL}
      BANK_TOKEN: ${BANK_TOKEN:?Set BANK_TOKEN}
      RELAY_KEY: ${RELAY_KEY}
      RELAY_STATE: /state/candy-bank-state.json
    volumes:
      - relay-state:/state
volumes:
  relay-state:
