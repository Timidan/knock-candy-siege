<svg xmlns="http://www.w3.org/2000/svg" width="256" height="320" viewBox="0 0 256 320">
<title>eyes/gradient-visor</title><defs><filter id="paper" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" seed="12" result="noise"/>
<feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
<feComposite in="grey" in2="SourceGraphic" operator="arithmetic" k1="0" k2=".18" k3="1" k4="-.09" result="grain"/>
<feComposite in="grain" in2="SourceAlpha" operator="in"/></filter></defs>
<g stroke-linecap="round" stroke-linejoin="round" filter="url(#paper)"><defs><linearGradient id="lens" x1="0" y1="0" x2="1" y2="0"><stop offset="0.000" stop-color="#46429b"/><stop offset="0.200" stop-color="#a676ab"/><stop offset="0.400" stop-color="#efb0a2"/><stop offset="0.600" stop-color="#f7daa9"/><stop offset="0.800" stop-color="#d58da6"/><stop offset="1.000" stop-color="#45449a"/></linearGradient></defs><path d="M58 142Q128 157 198 142 Q204 166 198 185Q128 207 58 185Q52 166 58 142Z" fill="url(#lens)" stroke="#181323" stroke-width="4.5"/></g></svg>
