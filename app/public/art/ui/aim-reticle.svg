<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><title>Aim reticle</title><desc>Open aim window with outlined cream corner marks for light and dark scenes.</desc><ns0:defs xmlns:ns0="http://www.w3.org/2000/svg"><ns0:filter id="paper" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><ns0:feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="12" stitchTiles="stitch" result="noise" /><ns0:feColorMatrix in="noise" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 0 1" result="gray" /><ns0:feComposite in="gray" in2="SourceGraphic" operator="arithmetic" k1="0" k2=".44" k3="1" k4="-.22" result="grain" /><ns0:feComposite in="grain" in2="SourceAlpha" operator="in" /></ns0:filter></ns0:defs><g filter="url(#paper)" stroke-linejoin="round" stroke-linecap="round"><g transform="rotate(0 128 128)" ><path d="M62 91 63 63 93 62" fill="none" stroke="#141414" stroke-width="12" /><path d="M62 91 63 63 93 62" fill="none" stroke="#F4EEDD" stroke-width="6" /></g><g transform="rotate(90 128 128)" ><path d="M62 91 63 63 93 62" fill="none" stroke="#141414" stroke-width="12" /><path d="M62 91 63 63 93 62" fill="none" stroke="#F4EEDD" stroke-width="6" /></g><g transform="rotate(180 128 128)" ><path d="M62 91 63 63 93 62" fill="none" stroke="#141414" stroke-width="12" /><path d="M62 91 63 63 93 62" fill="none" stroke="#F4EEDD" stroke-width="6" /></g><g transform="rotate(270 128 128)" ><path d="M62 91 63 63 93 62" fill="none" stroke="#141414" stroke-width="12" /><path d="M62 91 63 63 93 62" fill="none" stroke="#F4EEDD" stroke-width="6" /></g><ellipse cx="128" cy="128" rx="8" ry="8" fill="#FF7A1A" stroke="#141414" stroke-width="4"/></g></svg>
