<path d="M615 650 Q640 650 659 635 M769 620 Q794 624 808 611" stroke="#514A50" stroke-width="6" fill="none"/>
<path d="M593 678 L601 679 M841 635 L847 628" stroke-width="8"/>
</g>
</svg>
