<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
  <title>The Chog house street</title>
  <desc>A seamless horizontal street tile with a warm crooked lamp and a little iron fence.</desc>
  <!-- Tile edge contract: both x edges are transparent for y&lt;220, cream sidewalk 220..285,
       purple kerb 285..318, dark road 318..450, with black boundary strokes. Horizontal lines continue without end caps.
       Repeat at exactly 1000 CSS units, no gutters; lamp and fence stay inside the tile. -->
  <defs>
    <filter id="paper" x="0" y="0" width="1000" height="450" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="12" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 0 1" result="gray"/>
      <feComposite in="gray" in2="SourceGraphic" operator="arithmetic" k1="0" k2=".22" k3="1" k4="-.11" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#paper)" stroke="#141414" stroke-linejoin="round" stroke-linecap="round">
    <!-- Background fence ends before the repeat boundary. -->
    <g stroke-width="10" fill="#200052">
      <path d="M621 224 620 146 631 128 643 146 643 224ZM676 224 672 144 683 125 696 143 699 224ZM732 224 729 149 740 130 753 148 755 224ZM789 224 786 145 797 126 810 143 812 224ZM843 225 840 149 850 129 863 147 865 225Z"/>
      <path d="m614 172 258-2m-257 37 257-4" fill="none"/>
    </g>
    <path d="M893 232 897 106 906 101 914 231Z" fill="#200052" stroke-width="12"/>
    <path d="m878 230 50-1 10 13-70 1Z" fill="#836EF9" stroke-width="10"/>
    <path d="M877 52 936 52 930 112 886 113Z" fill="#FF7A1A" stroke-width="11"/>
    <path d="m887 62 40 1-6 39-27 1Z" fill="#F4EEDD" stroke="none"/>
    <path d="m905 60-1 44" fill="none" stroke-width="7"/>
    <path d="m868 53 37-28 42 26Z" fill="#836EF9" stroke-width="11"/>
    <path d="m905 24 1-10" fill="none" stroke-width="9"/>
    <!-- These full-width surfaces meet without vertical strokes at either edge. -->
    <path d="M0 220H1000V285H0Z" fill="#F4EEDD" stroke="none"/>
    <path d="M0 285H1000V318H0Z" fill="#836EF9" stroke="none"/>
    <path d="M0 318H1000V450H0Z" fill="#200052" stroke="none"/>
    <path d="M-15 226H1015M-15 285H1015M-15 318H1015" fill="none" stroke-width="12" stroke-linecap="butt"/>
    <path d="m128 225 5 56m167-55-3 53m180-54 4 55m170-55-5 54m170-53 7 52" fill="none" stroke-width="7"/>
    <path d="m185 287 2 27m260-25 1 25m280-23-1 24" fill="none" stroke-width="6"/>
    <path d="M92 390Q156 385 216 390M442 390Q503 394 558 389M786 390Q850 385 909 391" fill="none" stroke="#F4EEDD" stroke-width="12"/>
    <path d="m47 253 32 2m446 3 28-3m190 15 34-2" fill="none" stroke-width="3"/>
  </g>
</svg>
