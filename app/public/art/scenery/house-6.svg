<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <title>The crooked Chog house — Moss</title>
  <desc>A hand drawn purple-roofed haunted house with a blank number plaque and an open square portrait window.</desc>
  <!-- Portrait aperture: exact rect x=470 y=440 width=380 height=380. Frame is outside this rect. -->
  <!-- Number plaque: center (290,600); safe text area x=235 y=574 width=110 height=48. -->
  <defs>
    <mask id="portrait-cutout"><rect width="1000" height="1200" fill="white"/><rect x="470" y="440" width="380" height="380" fill="black"/></mask>
    <filter id="paper" x="0" y="0" width="1000" height="1200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="12" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 0 1" result="gray"/>
      <feComposite in="gray" in2="SourceGraphic" operator="arithmetic" k1="0" k2=".44" k3="1" k4="-.22" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <g mask="url(#portrait-cutout)" filter="url(#paper)" stroke="#141414" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- A chimney and an off-balance witch-hat roof. -->
